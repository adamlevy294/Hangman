<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7f3">
  <title>Hangman</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #182d2a;
      --muted: #71817b;
      --paper: #f4f7f3;
      --surface: #ffffff;
      --line: #dce5df;
      --green: #176b55;
      --green-dark: #10513f;
      --green-pale: #e5f2eb;
      --coral: #df684f;
      --gold: #eabf60;
      --shadow: 0 18px 50px rgba(35, 67, 54, .08);
    }

    
    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background-color: var(--paper);
      background-image: radial-gradient(#d8e5dc 0.75px, transparent 0.75px);
      background-size: 18px 18px;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }

    button, select { font: inherit; }

    button:focus-visible, select:focus-visible {
      outline: 3px solid #eabf60;
      outline-offset: 3px;
    }

    .page { width: min(100% - 36px, 980px); margin: 0 auto; padding: 28px 0 42px; }

    .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }

    .brand { display: flex; align-items: center; gap: 11px; font-size: 15px; font-weight: 800; letter-spacing: .04em; }

    .brand-mark {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      border-radius: 11px;
      color: white;
      background: var(--green);
      box-shadow: 0 5px 12px rgba(23, 107, 85, .2);
    }

    .brand-mark svg { width: 21px; height: 21px; }

    .round-label { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; font-weight: 700; }
    .round-label span { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); }

    .intro { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin: 0 0 19px; }

    .eyebrow { margin: 0 0 6px; color: var(--green); font-size: 11px; font-weight: 800; letter-spacing: .15em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(34px, 7vw, 52px); line-height: 1; letter-spacing: 0; }
    .intro p:last-child { margin: 10px 0 0; color: var(--muted); font-size: 14px; }

    .category-control { display: grid; gap: 6px; min-width: 164px; }
    .category-control label { color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .category-control select {
      width: 100%;
      padding: 10px 36px 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: var(--surface);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .game {
      overflow: hidden;
      border: 1px solid rgba(207, 222, 211, .9);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .game-main { display: grid; grid-template-columns: .92fr 1.08fr; min-height: 315px; }
    .drawing-panel { display: grid; place-items: center; padding: 20px; background: #edf5ef; }

    .drawing { width: min(100%, 300px); height: auto; overflow: visible; }
    .gallows { fill: none; stroke: #84a394; stroke-linecap: round; stroke-linejoin: round; stroke-width: 7; }
    .rope { fill: none; stroke: var(--coral); stroke-linecap: round; stroke-width: 4; }
    .person { fill: none; stroke: var(--ink); stroke-linecap: round; stroke-linejoin: round; stroke-width: 5; }
    .figure-part { opacity: 0; transition: opacity .25s ease; }
    .figure-part.visible { opacity: 1; }

    .puzzle-panel { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 28px 24px; text-align: center; }
    .status { min-height: 22px; margin: 0 0 28px; color: var(--muted); font-size: 13px; font-weight: 700; }
    .status strong { color: var(--green); }
    .status.lost strong { color: var(--coral); }
    .status.won strong { color: var(--green); }

    .word { display: flex; flex-wrap: wrap; justify-content: center; gap: 9px; min-height: 49px; margin-bottom: 24px; }
    .letter-slot {
      display: grid;
      width: 35px;
      height: 43px;
      place-items: center;
      border-bottom: 3px solid #9bb5a5;
      color: var(--ink);
      font-size: 25px;
      font-weight: 800;
      text-transform: uppercase;
    }
    .letter-slot.space { width: 15px; border: 0; }
    .letter-slot.revealed { animation: reveal .22s ease-out both; }
    @keyframes reveal { from { transform: translateY(5px); opacity: .35; } to { transform: translateY(0); opacity: 1; } }

    .attempts { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 12px; font-weight: 700; }
    .attempt-count { display: inline-grid; min-width: 29px; height: 29px; padding: 0 6px; place-items: center; border-radius: 8px; color: var(--green-dark); background: var(--green-pale); font-size: 14px; font-weight: 900; }
    .attempt-count.low { color: #a63f2e; background: #ffebe5; }

    .keyboard-panel { padding: 21px 28px 25px; border-top: 1px solid #edf1ee; }
    .keyboard-heading { display: flex; align-items: center; justify-content: space-between; margin-bottom: 13px; }
    .keyboard-heading h2 { margin: 0; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .keyboard-heading span { color: var(--muted); font-size: 11px; }
    .keyboard { display: flex; flex-wrap: wrap; justify-content: center; gap: 7px; }
    .key {
      width: 40px;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: #315247;
      background: #f8faf8;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: transform .12s ease, background .12s ease, border-color .12s ease;
    }
    .key:not(:disabled):hover { transform: translateY(-2px); border-color: #9dbdad; background: var(--green-pale); }
    .key:disabled { cursor: default; }
    .key.correct { border-color: #d4eadc; color: var(--green-dark); background: #e5f2eb; }
    .key.incorrect { border-color: #f3d9d1; color: #b05a46; background: #fbefeb; }

    .game-footer { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 15px 22px; border-top: 1px solid #edf1ee; }
    .hint { margin: 0; color: var(--muted); font-size: 12px; }
    .hint kbd { padding: 2px 5px; border: 1px solid var(--line); border-radius: 4px; color: #425d51; background: #f8faf8; font: inherit; font-weight: 800; }
    .new-word {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 39px;
      padding: 0 14px;
      border: 0;
      border-radius: 7px;
      color: white;
      background: var(--green);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: background .15s ease, transform .15s ease;
    }
    .new-word:hover { transform: translateY(-1px); background: var(--green-dark); }
    .new-word svg { width: 15px; height: 15px; }

    @media (max-width: 640px) {
      .page { width: min(100% - 24px, 500px); padding-top: 17px; }
      .topbar { margin-bottom: 24px; }
      .intro { align-items: start; flex-direction: column; gap: 16px; }
      .category-control { width: 100%; }
      .game-main { grid-template-columns: 1fr; }
      .drawing-panel { min-height: 205px; padding: 7px; }
      .drawing { width: 210px; max-height: 195px; }
      .puzzle-panel { padding: 21px 12px 25px; }
      .status { margin-bottom: 20px; }
      .word { gap: 6px; margin-bottom: 18px; }
      .letter-slot { width: 28px; height: 37px; font-size: 21px; }
      .letter-slot.space { width: 10px; }
      .keyboard-panel { padding: 18px 10px 21px; }
      .keyboard { gap: 5px; }
      .key { width: min(8.5vw, 35px); height: 39px; }
      .game-footer { align-items: start; padding: 13px; }
      .hint { max-width: 145px; line-height: 1.7; }
      .new-word { flex-shrink: 0; padding: 0 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M5 20V4h11M5 8h11m0 0v3m0-3h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="14" r="2" fill="currentColor"/></svg>
        </span>
        WORD CLUB
      </div>
      <div class="round-label"><span aria-hidden="true"></span> A little word challenge</div>
    </header>

    <section class="intro" aria-labelledby="page-title">
      <div>
        <p class="eyebrow">Guess the hidden word</p>
        <h1 id="page-title">Hangman</h1>
        <p>Pick a category, then save the stick figure one letter at a time.</p>
      </div>
      <div class="category-control">
        <label for="category">Word category</label>
        <select id="category">
          <option value="animals">Animals</option>
          <option value="countries">Countries</option>
          <option value="capitals">Capitals</option>
          <option value="films">Films</option>
          <option value="fruits">Fruits</option>
          <option value="vegetables">Vegetables</option>
          <option value="extreme">Extreme activities</option>
          <option value="electronics">Electronics</option>
          <option value="food">Food</option>
        </select>
      </div>
    </section>

    <section class="game" aria-label="Hangman game">
      <div class="game-main">
        <div class="drawing-panel" aria-hidden="true">
          <svg class="drawing" viewBox="0 0 280 250">
            <path class="gallows" d="M24 226h112M66 226V28h142v30"/>
            <path class="rope" d="M208 30v26"/>
            <circle class="person figure-part" data-part="1" cx="208" cy="78" r="20"/>
            <path class="person figure-part" data-part="2" d="M208 99v61"/>
            <path class="person figure-part" data-part="3" d="m208 116-30 27"/>
            <path class="person figure-part" data-part="4" d="m208 116 30 27"/>
            <path class="person figure-part" data-part="5" d="m208 159-27 40"/>
            <path class="person figure-part" data-part="6" d="m208 159 27 40"/>
          </svg>
        </div>

        <div class="puzzle-panel">
          <p class="status" id="status" aria-live="polite">Choose a letter to get started.</p>
          <div class="word" id="word" aria-label="Hidden word"></div>
          <div class="attempts" aria-live="polite">
            <span class="attempt-count" id="attempt-count">6</span>
            <span>wrong guesses left</span>
          </div>
        </div>
      </div>

      <div class="keyboard-panel">
        <div class="keyboard-heading">
          <h2>Choose a letter</h2>
          <span id="category-name">Animals</span>
        </div>
        <div class="keyboard" id="keyboard" aria-label="Letter keyboard"></div>
      </div>

      <footer class="game-footer">
        <p class="hint">You can also use your <kbd>A</kbd>–<kbd>Z</kbd> keys.</p>
        <button class="new-word" id="new-word" type="button">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 7v5h-5M4.9 9A7.5 7.5 0 0 1 18 6.5L20 12M4 17v-5h5m6 5.5A7.5 7.5 0 0 1 6 17.5L4 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          New word
        </button>
      </footer>
    </section>
  </main>

  <script>
    const wordsByCategory = {
      animals: ["DOLPHIN", "GIRAFFE", "PENGUIN", "OCTOPUS", "CHEETAH", "KANGAROO", "FLAMINGO", "HEDGEHOG"],
      countries: ["CANADA", "JAPAN", "BRAZIL", "ICELAND", "THAILAND", "MOROCCO", "PORTUGAL", "AUSTRALIA"],
      capitals: ["OTTAWA", "TOKYO", "BRASILIA", "REYKJAVIK", "BANGKOK", "RABAT", "LISBON", "CANBERRA"],
      films: ["JAWS", "COCO", "FROZEN", "TITANIC", "THE MATRIX", "INCEPTION", "GLADIATOR", "TOY STORY"],
      fruits: ["MANGO", "PAPAYA", "WATERMELON", "PINEAPPLE", "APRICOT", "BLUEBERRY", "CLEMENTINE", "POMEGRANATE"],
      vegetables: ["CARROT", "BROCCOLI", "SPINACH", "CAULIFLOWER", "ZUCCHINI", "ASPARAGUS", "ARTICHOKE", "EGGPLANT"],
      extreme: ["SKYDIVING", "SNOWBOARDING", "ROCK CLIMBING", "WHITE WATER RAFTING", "BUNGEE JUMPING", "BASE JUMPING", "MOUNTAIN BIKING", "SURFING"],
      electronics: ["HEADPHONES", "TELEVISION", "KEYBOARD", "SMARTPHONE", "MICROWAVE", "SPEAKER", "PROJECTOR", "CAMERA"],
      food: ["LASAGNA", "PANCAKES", "DUMPLINGS", "BURRITO", "SPAGHETTI", "CHEESECAKE", "OMELETTE", "SANDWICH"]
    };
    const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const categorySelect = document.querySelector("#category");
    const keyboard = document.querySelector("#keyboard");
    const wordDisplay = document.querySelector("#word");
    const statusDisplay = document.querySelector("#status");
    const attemptCount = document.querySelector("#attempt-count");
    const categoryName = document.querySelector("#category-name");
    const parts = [...document.querySelectorAll(".figure-part")];
    const maxWrongGuesses = parts.length;
    let answer = "";
    let guessedLetters = new Set();
    let wrongGuesses = 0;
    let finished = false;
    let previousWord = "";

    function startGame() {
      const category = categorySelect.value;
      const options = wordsByCategory[category];
      const choices = options.filter((word) => word !== previousWord);
      answer = choices[Math.floor(Math.random() * choices.length)];
      previousWord = answer;
      guessedLetters = new Set();
      wrongGuesses = 0;
      finished = false;
      categoryName.textContent = categorySelect.options[categorySelect.selectedIndex].text;
      statusDisplay.className = "status";
      statusDisplay.innerHTML = "Choose a letter to get started.";
      render();
    }

    function guessLetter(letter) {
      if (finished || guessedLetters.has(letter)) return;
      guessedLetters.add(letter);
      if (!answer.includes(letter)) wrongGuesses += 1;

      if ([...answer].every((character) => character === " " || guessedLetters.has(character))) {
        finished = true;
        statusDisplay.className = "status won";
        statusDisplay.innerHTML = "<strong>Lovely work!</strong> You found the word.";
      } else if (wrongGuesses >= maxWrongGuesses) {
        finished = true;
        statusDisplay.className = "status lost";
        statusDisplay.innerHTML = "Round over. Start a new word when you're ready.";
      } else {
        statusDisplay.className = "status";
        statusDisplay.innerHTML = answer.includes(letter)
          ? "Good guess. Keep going!"
          : "Not quite. Try another letter.";
      }

      render();
    }

    function render() {
      wordDisplay.replaceChildren();
      for (const character of answer) {
        const slot = document.createElement("span");
        if (character === " ") {
          slot.className = "letter-slot space";
          slot.setAttribute("aria-hidden", "true");
        } else {
          slot.className = "letter-slot";
          if (!finished && guessedLetters.has(character)) {
            slot.textContent = character;
            slot.classList.add("revealed");
          }
        }
        wordDisplay.append(slot);
      }

      attemptCount.textContent = String(maxWrongGuesses - wrongGuesses);
      attemptCount.classList.toggle("low", maxWrongGuesses - wrongGuesses <= 2);
      parts.forEach((part, index) => part.classList.toggle("visible", wrongGuesses > index));

      keyboard.replaceChildren();
      for (const letter of alphabet) {
        const key = document.createElement("button");
        key.type = "button";
        key.className = "key";
        key.textContent = letter;
        key.setAttribute("aria-label", `Guess ${letter}`);
        key.disabled = guessedLetters.has(letter) || finished;
        if (guessedLetters.has(letter)) key.classList.add(answer.includes(letter) ? "correct" : "incorrect");
        key.addEventListener("click", () => guessLetter(letter));
        keyboard.append(key);
      }
    }

    categorySelect.addEventListener("change", startGame);
    document.querySelector("#new-word").addEventListener("click", startGame);
    document.addEventListener("keydown", (event) => {
      if (event.key === "5" && !event.ctrlKey && !event.metaKey && !event.altKey) {
        startGame();
        return;
      }
      if (/^[a-z]$/i.test(event.key) && !event.ctrlKey && !event.metaKey && !event.altKey) {
        guessLetter(event.key.toUpperCase());
      }
    });

    startGame();
  </script>
</body>
</html>
